<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BookmarkMemo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c7f49'/%3E%3Cpath d='M8.5 4.5H23.5V27.5L16 21.5L8.5 27.5Z' fill='%23fff' stroke='%23fff' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M12.5 9H19.5M12.5 13H19.5M12.5 17H19.5' stroke='%231c7f49' stroke-width='1.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
body {
    margin: 0;
    background: #fff;
}

#bar {
    margin: 1vh 2% 0 2%;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    font-size: 13px;
}

#bar label,
#set label,
#set .set-item {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-left: 6px;
    user-select: none;
}

.ts-group {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 3px;
    border: 1px solid #2b2b2b;
    border-radius: 6px;
    background: rgba(245, 245, 245, 0.6);
    flex-wrap: wrap;
    flex-shrink: 0;
}

.ts-btn {
    flex: 0 0 auto;
    box-sizing: border-box;
    height: 24px;
    padding: 2px 3px;
    font-size: 10px;
    background: #fff;
    color: #000;
    border: 1px solid #000;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    font-weight: bold;
}

.ts-btn:hover,
#nums.radio .tab-btn:hover,
#pm:hover,
.ft .conv:hover {
    filter: brightness(85%);

}

.ts-btn:active,
#nums.radio .tab-btn:active,
#pm:active,
.ft .conv:active {
    filter: brightness(120%);

}

.ts-btn.off {
    opacity: 0.6;
    pointer-events: none;
}

.ts-btn.ts-checkmode {
    height: 22px;
    padding: 0 2px;
    background: #C7C7C7;
    color: #000;
    border: 2px solid #a4a4a4;

}

.ts-btn.ts-checkmode.ts-armed {
    background: #1c7f49;
    color: #f5f5f5;
    border: 2px solid #7d7d7d;
}

.ts-btn.ts-checkmode:hover {
    filter: brightness(110%);
}

.ts-btn.ts-checkmode:active {
    filter: brightness(115%);
}

#listSelect {
    box-sizing: border-box;
    height: 22px;
    font-size: 12px;
}

#listNumber {
    box-sizing: border-box;
    height: 28px;
    padding: 0 2px;
    text-align: center;
}

#listNumberReset {
    width: 24px;
    padding: 0;
    background: #FBBCC2;
    color: #fff;
    text-shadow: 1px 1px 1px rgba(150, 150, 150, 0.40);
    border: 1px solid #D9D9D9;
}

#bar .ts-check-label {
    margin: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
}

.ts-check-label input {
    display: none;
}

.ts-check-icon,
.tab-btn {
    display: inline-flex;
    box-sizing: border-box;
    height: 22px;
    width: auto;
    padding: 0 2px;
    background: #C7C7C7;
    color: #000;
    font-size: 14px;
    border-radius: 2px;
    cursor: pointer;
    align-items: center;
    border: 2px solid #a4a4a4;
    justify-content: center;
    white-space: nowrap;
}

.ts-check-icon {
    width: 28px;
    padding: 0;
}

.ts-check-label input:checked + .ts-check-icon,
.tab-btn.on {
    background: #1c7f49;
    color: #f5f5f5;
    border: 2px solid #7d7d7d;
}

.ts-icon-list {
    background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%224%22%20cy%3D%226%22%20r%3D%221.5%22%20fill%3D%22black%22%20stroke%3D%22none%22%2F%3E%3Ccircle%20cx%3D%224%22%20cy%3D%2212%22%20r%3D%221.5%22%20fill%3D%22black%22%20stroke%3D%22none%22%2F%3E%3Ccircle%20cx%3D%224%22%20cy%3D%2218%22%20r%3D%221.5%22%20fill%3D%22black%22%20stroke%3D%22none%22%2F%3E%3Cline%20x1%3D%229%22%20y1%3D%226%22%20x2%3D%2220%22%20y2%3D%226%22%2F%3E%3Cline%20x1%3D%229%22%20y1%3D%2212%22%20x2%3D%2220%22%20y2%3D%2212%22%2F%3E%3Cline%20x1%3D%229%22%20y1%3D%2218%22%20x2%3D%2220%22%20y2%3D%2218%22%2F%3E%3C%2Fsvg%3E');
    background-repeat: no-repeat;

.ts-check-label input[type="checkbox"]:checked + .ts-icon-list {

    background-repeat: no-repeat;
    background-position: center;
    background-size: 16px 16px;
}

.ts-icon-clock {
    background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%229%22%2F%3E%3Cpolyline%20points%3D%2212%207%2012%2012%2015.5%2014%22%2F%3E%3C%2Fsvg%3E');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 16px 16px;
}

.ts-check-label input[type="checkbox"]:checked + .ts-icon-clock {
    background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%229%22%2F%3E%3Cpolyline%20points%3D%2212%207%2012%2012%2015.5%2014%22%2F%3E%3C%2Fsvg%3E');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 16px 16px;
}

.ts-check-label:hover .ts-check-icon,
.tab-btn:hover {
    filter: brightness(110%);
}

.ts-check-label:active .ts-check-icon,
.tab-btn:active {
    filter: brightness(115%);
}

.ts-check-label:active .ts-check-icon,
.tab-btn:active {
    filter: brightness(115%);
}

#listOn + .ts-check-icon,
#tsEnterMode + .ts-check-icon {
    border-radius: 8px;
}

#r1 {
    display: flex;
    gap: 6px;
    width: 100%;
}

#tabs {
    flex: 1;
    flex-wrap: nowrap;
}

#r1 .tab-btn,
#r1 .ts-btn {

}

.tab-btn.n {
    flex: 1;
    font-size: 16px;
}

#r1 .ts-btn {
    font-size: 18px;

}

#nums {
    display: flex;

    gap: 3px;
}

#nums.radio {

}

#nums.radio .tab-btn {

}

#nums.radio .tab-btn:first-of-type {

}

#nums.radio .tab-btn:last-of-type {

}

}

    background: #1c7f49;
    color: #f5f5f5;

}

#pm {
    background: #fff;
    border: 1px solid #000;
    border-radius: 8px;
    padding: 0 6px;
}

input[type=number] {
    width: 40px;
    font-size: 12px;
}

#fsN {
    box-sizing: border-box;
    height: 28px;
}

#set .ts-btn {
    font-size: 14px;
    padding: 2px 10px;
}

#set {
    margin: 1vh 2%;
    display: flex;
}

#shades {
    position: relative;
    z-index: 101;
    display: flex;
}

#shades button {
    box-sizing: border-box;
    width: 30px;
    height: 22px;
    margin: 0;
    padding: 0;
    border: 1px solid #7e7f80;
    border-radius: 0;
    cursor: pointer;
}

#shades button:first-of-type {
    border-radius: 5px 0 0 5px;
}

#shades button:last-of-type {
    border-radius: 0 5px 5px 0;
}

#shades button + button {
    border-left: none;
}

#shades button.on {
    box-shadow: inset 0 0 0 3px #1c7f49;
}

#shades button:hover {

}

#shades button:active {
    filter: brightness(115%);
}

#wrap {
    display: flex;
    gap: 6px;
    margin: 2px 2% 0 2%;
}

.col {
    flex: 1;
    min-width: 0;
}

textarea {
    display: block;
    width: 100%;
    height: 70vh;
    box-sizing: border-box;
    background: #fff;
    font-size: 16px;
    line-height: 1.4;
    margin: 0;
}



.ft {
    position: relative;
        display: flex;
    justify-content: center;
    margin-top: 5px;
}

.ft button {
    padding: 5px 10px;
    background: #efefef;
}

.ft .conv {
    box-sizing: border-box;
    height: 28px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: bold;
 background-color: #F5F5F5;
color: #757575;
    border: 1px solid #9E9FA1;
    border-radius: 5px;
    cursor: pointer;
    outline: none;
}

.ft .conv.url {
}

.ft .copy {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    box-sizing: border-box;
    width: 45px;
    height: 28px;
    padding: 3px 4px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    background: #85A3FF;
    color: #fff;
    border: 1px solid #9E9FA1;
    border-radius: 5px;
    cursor: pointer;
    outline: none;
}

.ft .copy:hover {
    filter: brightness(110%);
}

.ft .copy:active {
    filter: brightness(120%);
}

.ft .clr,
.ft .back {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    box-sizing: border-box;
    height: 28px;
    padding: 3px 6px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    border-radius: 5px;
    cursor: pointer;
    outline: none;
}

.ft .clr {
    background: #FBBCC2;
    color: #fff;
    text-shadow: 1px 1px 1px rgba(150, 150, 150, 0.40);
    border: 1px solid #D9D9D9;
}

.ft .back {
    background: #F5F5F5;
    color: #757575;
    border: 1px solid #9E9FA1;
}

.ft .clr:hover,
.ft .back:hover {
    filter: brightness(110%);
}

.ft .clr:active,
.ft .back:active {
    filter: brightness(120%);
}

.ft.narrow {
    flex-wrap: wrap;
    justify-content: space-between;
}

.ft.narrow .clr,
.ft.narrow .back,
.ft.narrow .copy {
    position: static;
    transform: none;
}

.ft.narrow .clr,
.ft.narrow .back {
    order: 2;
}

.ft.narrow .copy {
    order: 1;
}

.ft.narrow .conv {
    order: 3;

}

#o {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    display: none;
    z-index: 102;
}

#timeBar {
    flex: 0 1 auto;
    flex-wrap: nowrap;
    min-width: 0;
    max-width: 100%;
    gap: 2px;
}

#timeBar .ts-btn {
    flex: 0 1 auto;
    min-width: 0;
    padding: 2px 1px;
    overflow: hidden;
    font-size: clamp(6px, 2.2vw, 10px);
}

#timeBar .ts-check-label {

}

#timeBar .ts-check-icon {

}

@media (max-width: 500px) {
    #timeBar {
        flex: 1 1 100%;
    }

    #timeBar .ts-check-label {
        flex: 1 1 0;
        min-width: 14px;
    }

    #timeBar .ts-check-icon {
        width: 100%;
    }

    #timeBar #tsYMDHM {
        font-size: clamp(5px, 1.7vw, 8px);
        line-height: 1;
    }

    #timeBar .ts-t {
        display: block;
    }
}

@media (max-width: 300px) {
    #timeBar {
        flex-wrap: wrap;
    }
}

#listBar {
    box-sizing: border-box;
    height: 30px;
}

#listBar #listNumber {
    height: 24px;
}

#listBar .ts-check-label {
    margin: 1px;
}
</style>
</head>
<body>

<div id="bar">
    <div id="r1">
        <div class="ts-group" id="tabs">
            <div id="nums" class="radio">
                <button class="tab-btn n" id="p0">1</button>
                <button class="tab-btn n" id="p1">2</button>
                <button class="tab-btn n" id="p2">3</button>
            </div>
            <button class="tab-btn" id="pm"></button>
        </div>
        <div class="ts-group">
            <button class="ts-btn" id="undoB">↶</button>
            <button class="ts-btn" id="redoB">↷</button>
        </div>
    </div>


    <div class="ts-group" id="timeBar">
        <label class="ts-check-label"><input type="checkbox" id="tsEnterMode"><span class="ts-check-icon ts-icon-clock"></span></label>
        <label class="ts-check-label"><input type="checkbox" id="tsNewline"><span class="ts-check-icon">↵</span></label>
                <label class="ts-check-label"><input type="checkbox" id="tsSpaceHead"><span class="ts-check-icon">␣</span></label>
                <button class="ts-btn" id="tsYMDHM"></button>
        <button class="ts-btn" id="tsYMD"></button>
        <button class="ts-btn" id="tsMDHM"></button>
        <button class="ts-btn" id="tsMD"></button>
        <button class="ts-btn" id="tsHM"></button>
        <label class="ts-check-label"><input type="checkbox" id="tsSpace"><span class="ts-check-icon">␣</span></label>
        <label class="ts-check-label"><input type="checkbox" id="tsAfter"><span class="ts-check-icon">↵</span></label>
    </div>

    <div class="ts-group" id="listBar">
        <select id="listSelect">
            <option value="bullet">•</option>
            <option value="dot">・</option>
            <option value="1">1.</option>
            <option value="01">01.</option>
        </select>
        <input type="number" id="listNumber" min="0" value="1">
        <button class="ts-btn" id="listNumberReset">R</button>
        <label class="ts-check-label"><input type="checkbox" id="listOn"><span class="ts-check-icon ts-icon-list"></span></label>
    </div>
</div>

<div id="wrap">
    <div class="col">
        <textarea id="memo" spellcheck="false"></textarea>
        <div class="ft">
            <button class="conv"></button>
            <button class="copy">Copy</button>
        </div>
    </div>
    <div class="col" style="display:none">
        <textarea id="memo2" spellcheck="false"></textarea>
        <div class="ft">
            <button class="conv"></button>
            <button class="copy">Copy</button>
        </div>
    </div>
    <div class="col" style="display:none">
        <textarea id="memo3" spellcheck="false"></textarea>
        <div class="ft">
            <button class="conv"></button>
            <button class="copy">Copy</button>
        </div>
    </div>
</div>

<div id="set">
    <div class="ts-group">
        <div class="set-item">
            <span>色</span>
            <div id="shades">
                <button></button>
                <button></button>
                <button></button>
                <button></button>
                <button></button>
            </div>
        </div>
        <div class="set-item">
            <span>文字</span>
            <input type="number" id="fsN" min="12" max="32" value="16">
            <button class="ts-btn" id="fsDown">-</button>
            <button class="ts-btn" id="fsUp">+</button>
        </div>
    </div>
</div>
<div id="o">このページをブックマークしてください</div>

<script>
const STORAGE_KEY = "bookmarkMemo";

const memos = [
    document.getElementById("memo"),
    document.getElementById("memo2"),
    document.getElementById("memo3")
];
const convertButtons = Array.from(document.querySelectorAll(".conv"));
const copyButtons = Array.from(document.querySelectorAll(".copy"));
const toast = document.getElementById("o");
const bar = document.getElementById("bar");

let currentMemo = memos[0];
let urlMode = location.hash.length > 1;

function byId(id) {
    return document.getElementById(id);
}

function pad(n, length = 2) {
    return String(n).padStart(length, "0");
}

function loadSetting(key, defaultValue) {
    try {
        const value = localStorage.getItem(key);
        if (value === null) {
            return defaultValue;
        }
        return value;
    } catch (e) {
        return defaultValue;
    }
}

function saveSetting(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (e) {
    }
}

function memoStorageKey(index) {
    return STORAGE_KEY + ["", "2", "3"][index];
}

function showToast(text, ms) {
    toast.textContent = text;
    toast.style.display = "block";
    setTimeout(function () {
        toast.style.display = "none";
    }, ms);
}


function updateTitle() {
    if (!urlMode) {
        return;
    }
    const now = new Date();
    const stamp = now.getFullYear() + "/" + pad(now.getMonth() + 1) + "/" + pad(now.getDate())
            + "_" + pad(now.getHours()) + ":" + pad(now.getMinutes());
    const firstLine = currentMemo.value.split("\n")[0].replace(/\s+/g, " ").slice(0, 20).trim();
    if (firstLine) {
        document.title = "BookmarkMemo " + stamp + " " + firstLine;
    } else {
        document.title = "BookmarkMemo " + stamp;
    }
}

function updateConvertLabels() {
    convertButtons.forEach(function (button) {
        button.textContent = urlMode ? "URL更新" : "URLTab↗";
        button.classList.toggle("url", urlMode);
        if (urlMode) {
        } else {
        }
    });
}

function saveCurrent() {
    if (!urlMode) {
        saveSetting(memoStorageKey(memos.indexOf(currentMemo)), currentMemo.value);
    }
    updateTitle();
}

memos.forEach(function (memoArea) {
    memoArea.oninput = function () {
        saveCurrent();
    };
    memoArea.onfocus = function () {
            currentMemo = memoArea;
        loadChecks();
        updateTitle();
    };
});

convertButtons.forEach(function (button, i) {
    button.onclick = function () {
        const hash = "#" + encodeURIComponent(memos[i].value);
        if (urlMode) {
            history.replaceState(0, 0, hash);
            showToast("Bookmark this page", 5000);
        } else {
            window.open(location.href.split("#")[0] + hash, "_blank");
        }
    };
});

copyButtons.forEach(function (button, i) {
    button.onclick = async function (e) {
        const memoArea = memos[i];
        e.preventDefault();
        button.blur();
        memoArea.blur();
        try {
            await navigator.clipboard.writeText(memoArea.value);
        } catch (err) {
            memoArea.select();
            document.execCommand("copy");
            memoArea.blur();
        }
        showToast("Copied", 2000);
    };
});

const clearButtons = [];

function setClearLabel(i) {
    const narrow = document.querySelectorAll(".ft")[i].classList.contains("narrow");
    clearButtons[i].textContent = narrow ? "Cl" : "Clear";
}

document.querySelectorAll(".ft").forEach(function (ft, i) {
    if (urlMode) {
        const back = document.createElement("button");
        back.className = "back";
        back.textContent = "← 通常ページ";
        back.title = "通常ページに戻る";
        back.onclick = function () {
            location.href = location.href.split("#")[0];
        };
        ft.appendChild(back);
        return;
    }

    const clr = document.createElement("button");
    clr.className = "clr";
    clearButtons[i] = clr;
    setClearLabel(i);

    clr.onmousedown = function (e) {
        e.preventDefault();
    };
    clr.onclick = function () {
        const memoArea = memos[i];
        if (!memoArea.value) {
            return;
        }
        if (!confirm("メモ" + (i + 1) + "の内容を削除しますか？")) {
            return;
        }
        currentMemo = memoArea;
        pushHistory();
        memoArea.value = "";
        memoArea.dispatchEvent(new Event("input"));
                pushHistory();
    };
    ft.appendChild(clr);
});

function updateNarrow() {
    const limit = urlMode ? 270 : 220;
    document.querySelectorAll(".ft").forEach(function (ft, i) {
        ft.classList.toggle("narrow", ft.clientWidth < limit);
        if (clearButtons[i]) {
            setClearLabel(i);
        }
    });
}

const narrowObserver = new ResizeObserver(updateNarrow);
document.querySelectorAll(".ft").forEach(function (ft) {
    narrowObserver.observe(ft);
});

const dateFormats = {
    tsYMDHM: function (d) {
        return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate())
            + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    },
    tsYMD: function (d) {
        return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
    },
    tsMDHM: function (d) {
        return pad(d.getMonth() + 1) + "/" + pad(d.getDate())
            + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    },
    tsMD: function (d) {
        return pad(d.getMonth() + 1) + "/" + pad(d.getDate());
    },
    tsHM: function (d) {
        return pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
};

function updateDateLabels() {
    const now = new Date();
    for (const id in dateFormats) {
        const s = dateFormats[id](now);
        const sp = s.indexOf(" ");
        byId(id).innerHTML = (id !== "tsYMDHM" || sp < 0) ? s : "<span>" + s.slice(0, sp) + "</span><span class=\"ts-t\">" + s.slice(sp) + "</span>";
    }
}

function insertDate(raw) {
    const spaceAfter = byId("tsSpace").checked;
    const spaceBefore = byId("tsSpaceHead").checked;

    let text = raw;
    if (spaceBefore) {
        text = " " + raw;
    } else if (spaceAfter) {
        text = raw + " ";
    }

    const start = currentMemo.selectionStart;
    const end = currentMemo.selectionEnd;
    const beforeCursor = currentMemo.value.slice(0, start);
    const currentLine = beforeCursor.slice(beforeCursor.lastIndexOf("\n") + 1);

    let insertText = text;
    if (byId("tsNewline").checked && currentLine.length) {
        insertText = "\n" + text;
    }
    if (byId("tsAfter").checked) {
        insertText = insertText + "\n";
    }

    currentMemo.focus();
    currentMemo.setRangeText(insertText, start, end, "end");
    currentMemo.dispatchEvent(new Event("input", { bubbles: true }));
}

for (const id in dateFormats) {
    byId(id).onclick = function () {
        if (tsEnterArm(id)) return;
        insertDate(dateFormats[id](new Date()));
    };
}

let tsEnterId = "";

function saveEnterMode() {
    saveSetting("bookmarkMemo.ent" + memos.indexOf(currentMemo),
        (byId("tsEnterMode").checked ? "1" : "0") + tsEnterId);
}

function loadEnterMode() {
    const v = loadSetting("bookmarkMemo.ent" + memos.indexOf(currentMemo), "0");
    byId("tsEnterMode").checked = (v[0] === "1");
    tsEnterId = dateFormats[v.slice(1)] ? v.slice(1) : "";
    applyTsEnterUI();
}

function applyTsEnterUI() {
    const on = byId("tsEnterMode").checked;
    for (const id in dateFormats) {
        byId(id).classList.toggle("ts-checkmode", on);
        byId(id).classList.toggle("ts-armed", on && id === tsEnterId);
    }
}

function tsEnterArm(id) {
    if (!byId("tsEnterMode").checked) return false;
    tsEnterId = (tsEnterId === id) ? "" : id;
    applyTsEnterUI();
    saveEnterMode();
    return true;
}

byId("tsEnterMode").addEventListener("change", function () {
    if (this.checked) {
        byId("listOn").checked = false;
        saveListMode();
    }
    applyTsEnterUI();
    saveEnterMode();
    currentMemo.focus();
});

memos.forEach(function (memoArea) {
    memoArea.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
        if (!byId("tsEnterMode").checked || !tsEnterId) return;
        if (memoArea.selectionStart !== memoArea.selectionEnd) return;
        e.preventDefault();
        insertDate(dateFormats[tsEnterId](new Date()));
    });
});

function saveListMode() {
    saveSetting("bookmarkMemo.list" + memos.indexOf(currentMemo), byId("listOn").checked ? "1" : "0");
}

function loadListMode() {
    byId("listSelect").value = loadSetting("bookmarkMemo.listMode" + memos.indexOf(currentMemo), loadSetting("bookmarkMemo.listMode", "bullet"));
    if (!byId("listSelect").value) {
        byId("listSelect").value = "bullet";
    }
    byId("listOn").checked = loadSetting("bookmarkMemo.list" + memos.indexOf(currentMemo), "0") === "1"
        && !byId("tsEnterMode").checked;
    byId("listNumber").value = loadSetting("bookmarkMemo.listNum" + memos.indexOf(currentMemo), "1");
    updateListNumberUI();
}

function isListNumbered() {
    const mode = byId("listSelect").value;
    return mode === "1" || mode === "01";
}

function getListNumber() {
    const n = parseInt(byId("listNumber").value, 10);
    return isNaN(n) ? 1 : n;
}

function setListNumber(n) {
    byId("listNumber").value = String(n);
    saveSetting("bookmarkMemo.listNum" + memos.indexOf(currentMemo), String(n));
}

function updateListNumberUI() {
    const numbered = isListNumbered();
    byId("listNumber").disabled = !numbered;
    byId("listNumber").style.opacity = numbered ? "" : "0.38";
    byId("listNumberReset").disabled = !numbered;
    byId("listNumberReset").classList.toggle("off", !numbered);
}

function listPrefix(num) {
    const mode = byId("listSelect").value;
    if (mode === "bullet") {
        return "• ";
    }
    if (mode === "dot") {
        return "・";
    }
    return (mode === "01" && num >= 0 && num <= 9 ? pad(num) : String(num)) + ". ";
}

function insertListPrefix(ta, fromOnButton) {
    if (ta.selectionStart !== ta.selectionEnd) return false;
    const start = ta.selectionStart;
    const before = ta.value.slice(0, start);
    const after = ta.value.slice(start);
    const leftOnLine = before.slice(before.lastIndexOf("\n") + 1);
    const lineEndRel = after.indexOf("\n");
    const rightOnLine = lineEndRel === -1 ? after : after.slice(0, lineEndRel);
    const num = getListNumber();
    const prefix = listPrefix(num);

    let insert;
    let toLineEnd = false;
    if (rightOnLine.length && !leftOnLine.length) {
        insert = prefix;
        toLineEnd = true;
    } else if (rightOnLine.length) {
        insert = "\n" + prefix;
        toLineEnd = fromOnButton;
    } else if (leftOnLine.length) {
        insert = "\n" + prefix;
    } else {
        insert = prefix;
    }

    ta.focus();
    if (!document.execCommand("insertText", false, insert)) {
        ta.setRangeText(insert, start, start, "end");
        ta.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (toLineEnd) {
        const p = ta.selectionStart + rightOnLine.length;
        ta.setSelectionRange(p, p);
    }
    if (isListNumbered()) {
        setListNumber(num + 1);
    }
    return true;
}

byId("listOn").addEventListener("change", function () {
    if (this.checked) {
        byId("tsEnterMode").checked = false;
        applyTsEnterUI();
        saveEnterMode();
        insertListPrefix(currentMemo, true);
    }
    saveListMode();
    currentMemo.focus();
});

byId("listSelect").addEventListener("change", function () {
    saveSetting("bookmarkMemo.listMode" + memos.indexOf(currentMemo), this.value);
    setListNumber(1);
    updateListNumberUI();
    currentMemo.focus();
});

byId("listNumber").addEventListener("wheel", function (e) {
    e.preventDefault();
    const cur = getListNumber();
    setListNumber(e.deltaY < 0 ? cur + 1 : Math.max(0, cur - 1));
}, { passive: false });

byId("listNumber").addEventListener("mousedown", function (e) {
    e.preventDefault();
});

byId("listNumberReset").onclick = function () {
    setListNumber(1);
    currentMemo.focus();
};

memos.forEach(function (memoArea) {
    memoArea.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
        if (!byId("listOn").checked) return;
        if (insertListPrefix(memoArea, false)) {
            e.preventDefault();
        }
    });
});

function setDateButtonsEnabled(enabled) {
    for (const id in dateFormats) {
        byId(id).disabled = !enabled;
        byId(id).classList.toggle("off", !enabled);
    }
}

setDateButtonsEnabled(false);

memos.forEach(function (memoArea) {
    memoArea.addEventListener("focus", function () {
        setDateButtonsEnabled(true);
    });
    memoArea.addEventListener("blur", function () {
        setDateButtonsEnabled(false);
    });
});

bar.onmousedown = function (e) {
    if (e.target.type !== "range" && e.target.type !== "number" && e.target.type !== "select-one") {
        e.preventDefault();
    }
};

const exclusivePairs = [
    ["tsNewline", "tsSpaceHead"],
    ["tsAfter", "tsSpace"],
    ["tsSpaceHead", "tsSpace"]
];

exclusivePairs.forEach(function (pair) {
    const first = pair[0];
    const second = pair[1];
    [first, second].forEach(function (id) {
        byId(id).addEventListener("change", function () {
            if (this.checked) {
                const otherId = (id === first) ? second : first;
                byId(otherId).checked = false;
            }
            saveChecks();
            currentMemo.focus();
        });
    });
});

const shadeAlphas = [0, 0.1, 0.2, 0.3, 0.4];
const shadeButtons = Array.from(document.querySelectorAll("#shades button"));

function shadeColor(index) {
    const gray = Math.round(255 * (1 - shadeAlphas[index]));
    return "rgb(" + gray + "," + gray + "," + gray + ")";
}

function applyShade(index) {
    const color = shadeColor(index);
    document.body.style.background = color;
    memos.forEach(function (memoArea) {
        memoArea.style.background = color;
    });
    shadeButtons.forEach(function (button, i) {
        button.classList.toggle("on", i === index);
    });
}

shadeButtons.forEach(function (button, i) {
    button.style.background = shadeColor(i);
    button.onclick = function () {
        applyShade(i);
        saveSetting("bookmarkMemo.shade", i);
    };
});

byId("shades").onmousedown = function (e) {
    e.preventDefault();
};

const fontNumber = byId("fsN");
const FONT_MIN = 12;
const FONT_MAX = 32;

function applyFontSize(value) {
    memos.forEach(function (memoArea) {
        memoArea.style.fontSize = value + "px";
    });
}

function setFontSize(value) {
    const v = Math.min(FONT_MAX, Math.max(FONT_MIN, Number(value) || 16));
    fontNumber.value = v;
    applyFontSize(v);
    saveSetting("bookmarkMemo.fs", v);
}

byId("fsDown").onclick = function () {
    setFontSize(Number(fontNumber.value) - 1);
};

byId("fsUp").onclick = function () {
    setFontSize(Number(fontNumber.value) + 1);
};

[byId("fsDown"), byId("fsUp")].forEach(function (button) {
    button.onmousedown = function (e) {
        e.preventDefault();
    };
});

const coarsePointer = window.matchMedia("(pointer: coarse)");
shadeButtons.concat([byId("fsDown"), byId("fsUp")]).forEach(function (button) {
    button.addEventListener("click", function () {
        if (coarsePointer.matches) {
            currentMemo.blur();
        }
    });
});

byId("set").addEventListener("focusin", function (e) {
    if (e.target.tagName !== "BUTTON") {
        return;
    }
    if (e.relatedTarget) {
        e.relatedTarget.focus();
    } else {
        e.target.blur();
    }
});

fontNumber.onchange = function () {
    setFontSize(fontNumber.value);
};

fontNumber.onchange = function () {
    setFontSize(fontNumber.value);
};

fontNumber.parentNode.addEventListener("wheel", function (e) {
    e.preventDefault();
    setFontSize(Number(fontNumber.value) + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });
const checkIds = ["tsNewline", "tsSpaceHead", "tsSpace", "tsAfter"];

function saveChecks() {
    const bits = checkIds.map(function (id) {
        return byId(id).checked ? 1 : 0;
    }).join("");
    saveSetting("bookmarkMemo.ck" + memos.indexOf(currentMemo), bits);
}

function loadChecks() {
    const bits = loadSetting("bookmarkMemo.ck" + memos.indexOf(currentMemo), "0000");
    checkIds.forEach(function (id, j) {
        byId(id).checked = (bits[j] === "1");
    });
    loadEnterMode();
    loadListMode();
}

let viewMode = 0;
let selectedIndex = 0;
let visibleFlags = [1, 0, 0];

const nums = byId("nums");
const pm = byId("pm");
const tabButtons = [byId("p0"), byId("p1"), byId("p2")];

function updateView() {
    let flags;
    if (urlMode) {
        flags = [1, 0, 0];
    } else if (viewMode) {
        flags = visibleFlags;
    } else {
        flags = memos.map(function (_, i) {
            return (i === selectedIndex) ? 1 : 0;
        });
    }

    memos.forEach(function (memoArea, i) {
        memoArea.parentNode.style.display = flags[i] ? "" : "none";
    });
    tabButtons.forEach(function (button, i) {
        button.classList.toggle("on", !!flags[i]);
    });
    nums.classList.toggle("radio", !viewMode);
    pm.textContent = viewMode ? "⇄ Multi" : "Single⇄";
    pm.parentNode.style.display = urlMode ? "none" : "";

    if (!flags[memos.indexOf(currentMemo)]) {
        currentMemo = memos[flags.indexOf(1)];
    }
    loadChecks();
}
function saveView() {
    saveSetting("bookmarkMemo.mode", viewMode);
    saveSetting("bookmarkMemo.sel", selectedIndex);
    saveSetting("bookmarkMemo.on", visibleFlags.join(""));
}

function loadView() {
    viewMode = Number(loadSetting("bookmarkMemo.mode", 0));
    selectedIndex = Number(loadSetting("bookmarkMemo.sel", 0));
    visibleFlags = Array.from(loadSetting("bookmarkMemo.on", "100")).map(Number);
    if (!visibleFlags.includes(1)) {
        visibleFlags = [1, 0, 0];
    }
    ensureMulti();
    updateView();
}

function ensureMulti() {
    let count = visibleFlags.reduce(function (a, b) { return a + b; }, 0);
    for (let k = 0; k < visibleFlags.length && count < 2; k++) {
        if (!visibleFlags[k]) {
            visibleFlags[k] = 1;
            count++;
        }
    }
}

function setViewMode(newMode) {
    if (newMode === viewMode) {
        return;
    }
    pushHistory();
    if (viewMode) {
        selectedIndex = memos.indexOf(currentMemo);
    } else {
        visibleFlags[selectedIndex] = 1;
        ensureMulti();
    }
    viewMode = newMode;
    saveView();
    updateView();
    currentMemo.focus();
    pushHistory();
}

pm.onclick = function () {
    setViewMode(viewMode ? 0 : 1);
};

tabButtons.forEach(function (button, i) {
    button.onclick = function () {
        pushHistory();
        if (viewMode) {
            visibleFlags[i] = visibleFlags[i] ? 0 : 1;
            if (visibleFlags.reduce(function (a, b) { return a + b; }, 0) < 2) {
                visibleFlags[i] = 1;
            }
            if (visibleFlags[i]) {
                currentMemo = memos[i];
            }
        } else {
            selectedIndex = i;
        }
        saveView();
        updateView();
        currentMemo.focus();
        pushHistory();
    };
});

let historyList = [];
let historyIndex = -1;
let historyTimer = null;
let composing = false;

function takeSnapshot() {
    return JSON.stringify([
        memos.map(function (memoArea) { return memoArea.value; }),
        memos.indexOf(currentMemo),
        viewMode,
        selectedIndex,
        visibleFlags
    ]);
}

function updateHistoryButtons() {
    const cannotUndo = historyIndex <= 0;
    const cannotRedo = historyIndex >= historyList.length - 1;

    byId("undoB").disabled = cannotUndo;
    byId("undoB").classList.toggle("off", cannotUndo);
    byId("redoB").disabled = cannotRedo;
    byId("redoB").classList.toggle("off", cannotRedo);
}

function pushHistory() {
    clearTimeout(historyTimer);
    const snapshot = takeSnapshot();
    if (historyList[historyIndex] === snapshot) {
        return;
    }
    historyList = historyList.slice(0, historyIndex + 1);
    historyList.push(snapshot);
    if (historyList.length > 100) {
        historyList.shift();
    }
    historyIndex = historyList.length - 1;
    updateHistoryButtons();
}

function moveHistory(direction) {
    if (composing) {
        currentMemo.blur();
        composing = false;
    }
    pushHistory();

    const next = historyIndex + direction;
    if (next < 0 || next >= historyList.length) {
        return;
    }
    historyIndex = next;

    const state = JSON.parse(historyList[historyIndex]);
    const values = state[0];
    memos.forEach(function (memoArea, j) {
        memoArea.value = values[j];
    });
    currentMemo = memos[state[1]];
    viewMode = state[2];
    selectedIndex = state[3];
    visibleFlags = state[4];

    if (!urlMode) {
        memos.forEach(function (memoArea, j) {
            saveSetting(memoStorageKey(j), memoArea.value);
        });
        saveView();
    }
    updateView();
    updateTitle();
    currentMemo.focus();
    updateHistoryButtons();
}

memos.forEach(function (memoArea) {
    memoArea.addEventListener("input", function (e) {
        clearTimeout(historyTimer);
        if (!e.isComposing) {
            historyTimer = setTimeout(pushHistory, 400);
        }
    });
    memoArea.addEventListener("compositionstart", function () {
        composing = true;
        pushHistory();
    });
    memoArea.addEventListener("compositionend", function () {
        composing = false;
        setTimeout(pushHistory, 0);
    });
});

byId("undoB").onclick = function () {
    moveHistory(-1);
};

byId("redoB").onclick = function () {
    moveHistory(1);
};

window.onload = function () {
    const savedShade = Number(loadSetting("bookmarkMemo.shade", 2));
    applyShade(shadeAlphas[savedShade] === undefined ? 2 : savedShade);

    setFontSize(loadSetting("bookmarkMemo.fs", 16));

    try {        if (urlMode) {
            const hashText = decodeURIComponent(location.hash.slice(1));
            if (hashText) {
                currentMemo.value = hashText;
            }
        } else {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                currentMemo.value = saved;
            }
            memos[1].value = localStorage.getItem(STORAGE_KEY + "2") ?? "";
            memos[2].value = localStorage.getItem(STORAGE_KEY + "3") ?? "";
        }
    } catch (e) {
    }

    loadView();
    updateConvertLabels();
    updateDateLabels();
    setInterval(updateDateLabels, 10000);
    updateTitle();
    currentMemo.focus();
    if (urlMode) {
        showToast("このページをブックマークしてください", 3500);
    }
    pushHistory();
};
</script>
